<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <style>
    .background {
      fill: #0d1117;
    }
    .frame {
      fill: none;
      stroke: #39ff14; /* Neon green */
      stroke-width: 2;
      rx: 15;
      filter: drop-shadow(0 0 5px rgba(57, 255, 20, 0.8));
      animation: pulse-frame 3s infinite alternate;
    }
    .ascii {
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      font-weight: bold;
      fill: #39ff14; /* Neon green */
      white-space: pre;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      0% {
        opacity: 0.7;
        filter: drop-shadow(0 0 2px rgba(57, 255, 20, 0.5));
      }
      100% {
        opacity: 1;
        filter: drop-shadow(0 0 8px rgba(57, 255, 20, 1));
      }
    }
    @keyframes pulse-frame {
      0% {
        filter: drop-shadow(0 0 2px rgba(57, 255, 20, 0.3));
      }
      100% {
        filter: drop-shadow(0 0 10px rgba(57, 255, 20, 0.8));
      }
    }
  </style>
  <rect class="background" width="100%" height="100%" rx="15"/>
  <rect class="frame" x="10" y="10" width="780" height="630" />
