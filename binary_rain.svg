<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 300" width="570" height="300" style="overflow:hidden">
<style>
  .m{font-family:'Courier New',Courier,monospace;font-size:13px;fill:#0a4520}
  .h{font-family:'Courier New',Courier,monospace;font-size:13px;fill:#39ff14}
  @keyframes rain{0%{transform:translateY(-280px)}100%{transform:translateY(300px)}}
  .c0{animation:rain 3.0s linear infinite}
  .c1{animation:rain 2.8s linear infinite;animation-delay:-0.5s}
  .c2{animation:rain 3.3s linear infinite;animation-delay:-1.0s}
  .c3{animation:rain 2.6s linear infinite;animation-delay:-1.5s}
  .c4{animation:rain 3.1s linear infinite;animation-delay:-0.3s}
  .c5{animation:rain 2.9s linear infinite;animation-delay:-1.8s}
  .c6{animation:rain 3.5s linear infinite;animation-delay:-0.7s}
  .c7{animation:rain 2.7s linear infinite;animation-delay:-2.1s}
  .c8{animation:rain 3.2s linear infinite;animation-delay:-0.9s}
  .c9{animation:rain 2.5s linear infinite;animation-delay:-1.3s}
  .c10{animation:rain 3.4s linear infinite;animation-delay:-0.4s}
  .c11{animation:rain 2.8s linear infinite;animation-delay:-2.4s}
  .c12{animation:rain 3.0s linear infinite;animation-delay:-1.1s}
  .c13{animation:rain 2.9s linear infinite;animation-delay:-0.6s}
  .c14{animation:rain 3.1s linear infinite;animation-delay:-1.7s}
  @keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}
  .nm{font-family:'Courier New',Courier,monospace;font-size:20px;fill:#39ff14;font-weight:bold;animation:glow 2s ease-in-out infinite}
  .sb{font-family:'Courier New',Courier,monospace;font-size:11px;fill:#00cc33}
  .bn{font-family:'Courier New',Courier,monospace;font-size:8px;fill:#005022}
  @keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
  .cu{fill:#39ff14;font-family:'Courier New',Courier,monospace;font-size:11px;animation:cur 1s step-end infinite}
  @keyframes border-glow{0%,100%{stroke-opacity:.5}50%{stroke-opacity:1}}
  .card-border{animation:border-glow 2s ease-in-out infinite}
</style>
<defs>
