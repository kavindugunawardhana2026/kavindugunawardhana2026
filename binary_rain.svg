  </filter>
  <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
    <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
